name: release
# Tagged release: builds Apple Silicon + Intel DMGs and uploads to a draft
# GitHub Release. Trigger by pushing a version tag (e.g. `git tag v0.2.0 &&
# git push origin v0.2.0`). The Release stays in draft until you manually
# publish it from the GitHub UI — that's the gate before users see it.
#
# Code signing & notarization are active. Required repository secrets:
#   CSC_LINK                       - base64-encoded .p12 cert (Developer ID Application)
#   CSC_KEY_PASSWORD               - password for the .p12
#   APPLE_ID                       - Apple ID email
#   APPLE_APP_SPECIFIC_PASSWORD    - app-specific password generated at appleid.apple.com
#   APPLE_TEAM_ID                  - 10-char Team ID from developer.apple.com/account
# electron-builder reads these from the environment and handles signing and
# notarization via notarytool automatically. To disable, set mac.identity: null,
# mac.hardenedRuntime: false, and remove mac.notarize from
# packages/desktop/package.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Fail fast if the tag and the shippable version disagree. electron-builder
      # reads packages/desktop/package.json for ${version} (artifact names + the
      # runtime app.getVersion()); the root/core package versions are not read by
      # the build. Guarding here means a forgotten desktop bump dies in seconds
      # instead of shipping a mislabeled DMG after a 30-min sign+notarize pass.
      - name: Verify desktop version matches tag
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(node -p "require('./packages/desktop/package.json').version")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag $TAG expects version $EXPECTED but packages/desktop/package.json is $ACTUAL"
            exit 1
          fi
          echo "✓ desktop version $ACTUAL matches tag $TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build DMGs + ZIPs (both archs)
        timeout-minutes: 30
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Single electron-builder invocation builds both x64 and arm64 in one
        # pass and writes a single latest-mac.yml that lists both architectures.
        # electron-updater 6.x picks the right artifact at runtime based on the
        # running process.arch, so x64 installs get the x64 zip and arm64
        # installs get the arm64 zip — no separate manifest needed.
        #
        # Default artifact naming: x64 → Skills-Bank-${version}.{dmg,zip},
        # arm64 → Skills-Bank-${version}-arm64.{dmg,zip}.
        run: pnpm exec electron-builder --mac --x64 --arm64 --publish never
      - name: Upload DMGs to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          gh release view "$TAG" 2>/dev/null \
            || gh release create "$TAG" \
               --draft \
               --title "$TAG" \
               --notes ""
          gh release upload "$TAG" \
            packages/desktop/dist-electron/*.dmg \
            packages/desktop/dist-electron/*.dmg.blockmap \
            packages/desktop/dist-electron/*.zip \
            --clobber
          # zip blockmaps are produced for delta updates; upload only if present
          if ls packages/desktop/dist-electron/*.zip.blockmap >/dev/null 2>&1; then
            gh release upload "$TAG" \
              packages/desktop/dist-electron/*.zip.blockmap \
              --clobber
          fi
          if ls packages/desktop/dist-electron/latest-mac.yml 2>/dev/null; then
            gh release upload "$TAG" \
              packages/desktop/dist-electron/latest-mac.yml \
              --clobber
          fi
