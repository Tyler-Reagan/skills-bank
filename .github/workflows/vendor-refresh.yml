name: vendor-refresh

# Weekly drift sweep + on-demand button. Walks skills/vendored/*,
# diffs each against its upstream's current folder hash, re-mirrors
# any drift, then opens a PR with the result. Maintainer reviews
# the diff and merges.
#
# Cron: 09:00 UTC every Monday. Manual run accepts an `only` filter
# (scope to a subset) and an `apply` toggle (false → review-only).

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated subset of vendored skill names. Empty = all."
        required: false
        default: ""
      apply:
        description: "Re-mirror drifted skills (uncheck for review-only run)."
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run vendor refresh
        id: refresh
        env:
          # The workflow's GITHUB_TOKEN is enough to lift unauth requests
          # past the 60/hr ceiling on the upstream probes — bank refresh
          # picks it up automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply"
          fi
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ inputs.only }}"
          fi
          echo "Running: pnpm bank refresh $ARGS"
          pnpm bank refresh $ARGS | tee refresh.log

      - name: Re-validate + rebuild index
        # Always run these — if --apply was off, both are no-ops; if
        # --apply was on and modified files, these catch any schema
        # break before we open the PR.
        run: |
          pnpm validate
          # Did the refresh actually re-mirror any vendored skill content?
          # Capture before rebuilding: build:index rewrites index.json's
          # volatile fields (generatedAt timestamp, git-derived lastCommit,
          # canon cache) on every run regardless of drift, which would
          # otherwise leave the tree dirty and make create-pull-request open
          # an empty PR each run.
          if git diff --quiet -- skills/; then DRIFT=0; else DRIFT=1; fi
          pnpm build:index
          # No real drift → discard the volatile index.json churn so the PR
          # step stays a true no-op. On real drift, keep the regenerated
          # index so the PR carries a consistent index.
          if [ "$DRIFT" = "0" ]; then
            git checkout -- index.json
          fi

      - name: Compose PR body
        id: body
        # Inline the refresh report so the maintainer can scan it
        # without clicking through to the Action run. Heredoc into
        # GITHUB_OUTPUT with a random delimiter to survive any
        # log line that happens to contain `EOF`.
        run: |
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$DELIM"
            echo "Automated bulk refresh of \`skills/vendored/*\` against their pinned upstreams. Generated by \`.github/workflows/vendor-refresh.yml\`."
            echo
            echo "Review the diff for unexpected upstream changes (renames, removed files, license shifts) before merging."
            echo
            echo "<details><summary>Refresh report</summary>"
            echo
            echo '```'
            cat refresh.log 2>/dev/null || echo "no log captured"
            echo '```'
            echo
            echo "</details>"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Open PR with drift refresh
        # peter-evans/create-pull-request handles the
        # stage+commit+push+open-PR sequence and is a no-op when the
        # working tree has no changes. Branch is stable so a second
        # run within a week updates the existing PR rather than
        # stacking duplicates.
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/vendor-refresh
          base: main
          commit-message: "chore(vendored): bulk refresh against upstreams"
          title: "chore(vendored): bulk refresh against upstreams"
          body: ${{ steps.body.outputs.body }}
          delete-branch: false
          labels: |
            chore
            automation
